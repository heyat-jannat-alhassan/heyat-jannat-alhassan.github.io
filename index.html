<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مدیریت | هیئت جنت الحسن</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="admin-page">

  <section class="adminbox">

    <div id="loginBox">

      <h2>🔐 ورود مدیریت</h2>

      <p>
        این بخش فقط برای مدیر سایت است.
      </p>

      <input
        type="password"
        id="adminPassword"
        placeholder="رمز مدیریت"
        autocomplete="current-password"
      >

      <button class="primary admin-btn" id="loginBtn">
        ورود
      </button>

      <p class="error" id="loginError"></p>

      <a class="back-home" href="index.html">
        ← بازگشت به سایت
      </a>

    </div>


    <div id="panelBox" class="hidden">

      <div class="panel-head">

        <div>
          <small>مدیریت سایت</small>
          <h2>پنل مدیریت</h2>
        </div>

        <button
          id="logoutBtn"
          class="logout"
        >
          خروج
        </button>

      </div>


      <div class="form">

        <input
          id="newTitle"
          placeholder="عنوان گزارش"
        >

        <input
          id="newReciter"
          placeholder="نام مداح"
        >

        <input
          id="newSpeaker"
          placeholder="نام سخنران"
        >

        <select id="newStyle">
          <option value="">انتخاب سبک</option>
          <option>سخنرانی</option>
          <option>روضه</option>
          <option>زمینه</option>
          <option>تک</option>
          <option>شور</option>
        </select>

        <select id="newEvent">
          <option value="">انتخاب نوع مراسم</option>
          <option>عزاداری</option>
          <option>مولودی</option>
        </select>

        <input
          id="newAudio"
          placeholder="لینک فایل صوتی"
        >

        <button
          class="primary"
          id="addReport"
        >
          افزودن گزارش
        </button>

      </div>


      <div class="manage">

        <h3>گزارش‌های موجود</h3>

        <div id="manageList"></div>

      </div>

    </div>

  </section>

</main>

<script src="app.js"></script>

<script>
  initAdminPanel();
</script>

</body>
</html>
