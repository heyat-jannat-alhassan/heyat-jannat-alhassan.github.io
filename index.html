<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>هیئت جنت الحسن | آرشیو صوتی</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">

  <button
    class="menu"
    id="menuBtn"
    aria-label="منوی سایت">
    ☰
  </button>

  <div class="brand">

    <h1>هیئت جنت الحسن</h1>

    <p>
      آرشیو گزارش‌های صوتی
    </p>

  </div>

</header>


<!-- منوی سه خط -->

<div
  class="drawer"
  id="drawer">

  <button
    class="close"
    id="close">
    ×
  </button>

  <h2>
    منوی سایت
  </h2>

  <a href="#home">
    خانه
  </a>

  <a href="#latest">
    آخرین گزارش‌ها
  </a>

  <a href="#archive">
    آرشیو صوتی
  </a>

  <a href="#channels">
    کانال‌های هیئت
  </a>

</div>


<div
  class="shade"
  id="shade">
</div>


<main id="home">


<!-- معرفی سایت -->

<section class="hero">

  <span>
    شروع آرشیو: محرم ۱۴۰۵
  </span>

  <h2>

    گزارش‌های صوتی

    <br>

    <b>
      هیئت جنت الحسن
    </b>

  </h2>

  <p>

    آرشیوی مرتب، قابل جست‌وجو و ساده
    برای پخش و دانلود گزارش‌های صوتی هیئت.

  </p>

  <a
    class="primary"
    href="#archive">

    مشاهده آرشیو

  </a>

</section>


<!-- آخرین گزارش‌ها -->

<section
  id="latest"
  class="section">

  <div class="head">

    <div>

      <small>
        تازه‌ترین‌ها
      </small>

      <h3>
        آخرین گزارش‌ها
      </h3>

    </div>


    <div>

      <button
        class="arr"
        id="prev">

        ‹

      </button>


      <button
        class="arr"
        id="next">

        ›

      </button>

    </div>

  </div>


  <div
    class="row"
    id="latestRow">

  </div>

</section>


<!-- آرشیو -->

<section
  id="archive"
  class="section">

  <small>
    محرم ۱۴۰۵ به بعد
  </small>

  <h3>
    آرشیو گزارش‌ها
  </h3>


  <div class="filters">


    <input
      id="q"
      placeholder="جست‌وجوی عنوان، مداح یا سخنران...">


    <select id="style">

      <option value="">
        سبک
      </option>

      <option>
        سخنرانی
      </option
